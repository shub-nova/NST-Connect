name: Escalation check

# Moves tickets that nobody acted on for 48 hours up a level, and sends the "12 hours left" warnings.
# The API runs on serverless hosting with no always-on timer, so this schedule is what drives it.
# Hourly on purpose: every run costs a billed minute, and a private repository on the free plan has 2,000 a month
# (every 15 minutes would use about 2,900). GitHub may also start runs a few minutes late; both are fine for a 48-hour limit.
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Call the API
        env:
          API_URL: ${{ secrets.API_URL }}
          JOB_SECRET: ${{ secrets.JOB_SECRET }}
        run: |
          if [ -z "$API_URL" ] || [ -z "$JOB_SECRET" ]; then
            echo "API_URL or JOB_SECRET is not set in the repository secrets: nothing to do."
            exit 0
          fi
          curl --fail-with-body --silent --show-error --max-time 60 --retry 2 \
            -X POST "${API_URL%/}/api/internal/escalation/run" \
            -H "x-job-secret: $JOB_SECRET"
          echo
