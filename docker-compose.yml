services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: nstconnect
      POSTGRES_PASSWORD: nstconnect_dev
      POSTGRES_DB: nstconnect
    ports: ["5432:5432"]
    volumes: [dbdata:/var/lib/postgresql/data]
  # S3-compatible object storage for local dev (stand-in for Cloudflare R2).
  # minio/minio is no longer published on Docker Hub, so we use RustFS.
  s3:
    image: rustfs/rustfs:latest
    environment:
      RUSTFS_ACCESS_KEY: nstconnect
      RUSTFS_SECRET_KEY: nstconnect_dev_secret
    ports: ["9000:9000", "9001:9001"]
    volumes: [s3data:/data]
  mailpit:
    image: axllent/mailpit
    ports: ["1025:1025", "8025:8025"]
volumes:
  dbdata:
  s3data:
